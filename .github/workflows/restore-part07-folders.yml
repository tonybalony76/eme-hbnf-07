name: Restore Part 07 folder structure

on:
  push:
    paths:
      - "FNF-Part-07-Missing-Files.zip"
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore the original folders
        run: |
          test -f FNF-Part-07-Missing-Files.zip
          find . -maxdepth 1 -type f \
            ! -name 'README*' \
            ! -name 'LICENSE*' \
            ! -name '.gitignore' \
            ! -name 'FNF-Part-07-Missing-Files.zip' \
            -delete
          unzip -q -o FNF-Part-07-Missing-Files.zip -d .
          rm FNF-Part-07-Missing-Files.zip

      - name: Save the corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore Part 07 folder structure"
            git push
          fi
